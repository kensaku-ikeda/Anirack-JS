<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anirack</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="top">
      <div class="container">
        <div class="app-header">
          <h1 class="logo">Anirack</h1>
          <p class="work-count">8作品</p>
        </div>
      </div>
    </div>

    <main>
      <dialog class="dialog edit-dialog">
        <div class="dialog-container">
          <div class="dialog-header">
            <button class="edit-cancel-btn btn-tap-size">✕</button>
            <h2>編集する</h2>
            <div class="btn-tap-size"></div>
          </div>
          <label for="title-rename">
            <span class="label-text">TITLE / タイトル</span>
            <input
              type="text"
              id="title-rename"
              class="title-input"
              name="content-title-rename"
              placeholder="作品の名前を入力してください"
              required
            />
          </label>
          <label for="edit-review-text">
            <span class="label-text">REVIEW / 感想</span>
            <textarea
              id="edit-review-text"
              class="review-text-area"
              rows="5"
              placeholder="感想はまだありません"
            ></textarea>
          </label>
          <div class="dialog-btn">
            <button class="edit-save-btn">保存</button>
          </div>
        </div>
      </dialog>

      <div class="container">
        <dialog class="dialog add-dialog">
          <div class="dialog-container">
            <div class="dialog-header">
              <button class="add-cancel-btn btn-tap-size">✕</button>
              <h2>新しい作品</h2>
              <div class="btn-tap-size"></div>
            </div>
            <form>
              <label for="title">
                <span class="label-text">TITLE / タイトル</span>
                <input
                  type="text"
                  id="title"
                  class="title-input"
                  name="content-title"
                  placeholder="作品の名前を入力してください"
                  required
                />
              </label>
              <label for="add-review-text">
                <span class="label-text">REVIEW / 感想</span>
                <textarea
                  id="add-review-text"
                  class="review-text-area"
                  name="content-review"
                  rows="5"
                  placeholder="感想を入力してください"
                ></textarea>
              </label>
              <div class="dialog-btn">
                <button type="submit">追加</button>
              </div>
            </form>
          </div>
        </dialog>
        <ul class="title-list"></ul>
      </div>
    </main>

    <div class="bottom-bar">
      <div class="container">
        <button class="open-add-dialog-btn" type="button">＋記録する</button>
      </div>
    </div>
    <script src="js/script.js" defer></script>
  </body>
</html>
