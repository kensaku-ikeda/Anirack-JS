<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anirack</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="top">
      <div class="container">
        <div class="app-header">
          <h1 class="logo">Anirack</h1>
          <p class="work-count">8作品</p>
        </div>
      </div>
    </div>

    <main>
      <dialog class="dialog">
        <div class="dialog-container">
          <label for="title-rename"
            >タイトル
            <input
              type="text"
              id="title-rename"
              name="content-title-rename"
              placeholder="作品の名前を入力してください"
              required
            />
          </label>
          <div class="dialog-btn">
            <button class="cancel-btn">キャンセル</button>
            <button class="save-btn">保存</button>
          </div>
        </div>
      </dialog>

      <div class="container">
        <form>
          <label for="title"
            >タイトル
            <input
              type="text"
              id="title"
              name="content-title"
              placeholder="作品の名前を入力してください"
              required
            />
          </label>
          <button type="submit">追加</button>
        </form>
        <ul class="title-list"></ul>
      </div>
    </main>

    <div class="bottom-bar">
      <div class="container">
        <button class="record" type="button">＋記録する</button>
      </div>
    </div>
    <script src="js/script.js" defer></script>
  </body>
</html>
