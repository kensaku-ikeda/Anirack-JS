<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anirack</title>
    <link rel="icon" href="icons/favicon.ico" sizes="any" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="top">
      <div class="container">
        <div class="app-header">
          <h1 class="logo">Anirack</h1>
        </div>
      </div>
    </div>

    <main class="shelf-list"></main>

    <div class="bottom-bar">
      <div class="container">
        <button class="open-add-dialog-btn" type="button">＋記録する</button>
      </div>
    </div>

    <dialog class="dialog edit-dialog" closedby="none">
      <div class="dialog-container">
        <div class="dialog-header">
          <button class="edit-cancel-btn btn-tap-size">✕</button>
          <h2>編集</h2>
          <div class="btn-tap-size"></div>
        </div>
        <label for="title-rename">
          <span class="label-text">TITLE / タイトル</span>
          <input
            type="text"
            id="title-rename"
            class="title-input"
            name="content-title-rename"
            placeholder="作品の名前を入力してください"
            required
          />
        </label>
        <label for="edit-review-text">
          <span class="label-text">REVIEW / 感想</span>
          <textarea
            id="edit-review-text"
            class="review-text-area"
            rows="5"
            placeholder="感想はまだありません"
          ></textarea>
        </label>
        <button class="btn-primary edit-save-btn">保存する</button>
        <button class="link-danger content-delete-btn">
          この作品を本棚から出す
        </button>
        <div class="delete-confirm hidden">
          <p class="delete-confirm-title">
            「<span class="delete-confirm-content-title"></span
            >」を本棚から出しますか？
          </p>
          <p class="delete-confirm-text">
            感想も一緒に消えます。取り消せません。
          </p>
          <div class="delete-confirm-actions">
            <button
              class="delete-confirm-btn delete-confirm-cancel-btn"
              type="button"
            >
              やめる
            </button>
            <button
              class="delete-confirm-btn delete-confirm-submit-btn"
              type="button"
            >
              出す
            </button>
          </div>
        </div>
      </div>
    </dialog>

    <dialog class="dialog add-dialog" closedby="none">
      <div class="dialog-container">
        <div class="dialog-header">
          <button class="add-cancel-btn btn-tap-size">✕</button>
          <h2>新しい作品</h2>
          <div class="btn-tap-size"></div>
        </div>
        <form>
          <div>
            <div class="search-type">
              <span class="label-text">検索先</span>
              <div class="search-type-options">
                <button class="search-type-btn" type="button" aria-pressed="true" data-type="ANIME">アニメ</button>
                <button class="search-type-btn" type="button" aria-pressed="false" data-type="MANGA">漫画</button>
              </div>
            </div>
            <label for="title">
              <span class="label-text">TITLE / タイトル</span>
            </label>
            <div class="title-search-row">
              <input
                type="text"
                id="title"
                class="title-input"
                name="content-title"
                placeholder="作品の名前を入力してください"
                required
              />
              <button type="button" class="search-btn">検索</button>
            </div>
          </div>

          <div class="search-area">
            <p class="search-count"></p>
            <ul class="search-results hidden"></ul>
            <p class="search-status hidden" role="status"></p>
            <p class="api-credit">作品データ:AniList API</p>
          </div>

          <label for="add-review-text">
            <span class="label-text">REVIEW / 感想</span>
            <textarea
              id="add-review-text"
              class="review-text-area"
              name="content-review"
              rows="5"
              placeholder="感想を入力してください"
            ></textarea>
          </label>
          <button class="btn-primary" type="submit">追加</button>
        </form>
      </div>
    </dialog>
    <script src="js/script.js" defer></script>
  </body>
</html>
