<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anirack</title>
  </head>
  <body>
    <main>
      <dialog class="dialog">
        <div class="dialog-container">
          <label for="title-rename"
            >タイトル
            <input
              type="text"
              id="title-rename"
              name="content-title-rename"
              placeholder="作品の名前を入力してください"
              required
            />
          </label>
          <div class="dialog-btn">
            <button class="cancel-btn">キャンセル</button>
            <button class="save-btn">保存</button>
          </div>
        </div>
      </dialog>

      <div class="container">
        <h1 class="app-title">Anirack</h1>
        <form>
          <label for="title"
            >タイトル
            <input
              type="text"
              id="title"
              name="content-title"
              placeholder="作品の名前を入力してください"
              required
            />
          </label>
          <button type="submit">追加</button>
        </form>
        <ul class="title-list"></ul>
      </div>
    </main>
    <script src="js/script.js" defer></script>
  </body>
</html>
