<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anirack</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="top">
      <div class="container">
        <h1 class="app-title">Anirack</h1>
      </div>
    </div>

    <main>
      <div class="container">
        <form>
          <label for="title"
            >タイトル
            <input
              type="text"
              id="title"
              name="content-title"
              placeholder="作品の名前を入力してください"
              required
            />
          </label>
          <button type="submit">追加</button>
        </form>
        <ul class="title-list"></ul>
      </div>
    </main>

    <div class="bottom-bar">
      <div class="container">
        <div class="save-button">
          <button type="button">＋記録する</button>
        </div>
      </div>
    </div>
    <script src="js/script.js" defer></script>
  </body>
</html>
